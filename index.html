                            <button onClick={openDemo} className="inline-block bg-orange-600 text-white font-bold py-4 px-8 rounded-full shadow-lg hover:bg-orange-700 transition">
                                Book a Free Chess Class
                            </button>
                        </div>
                    </div>
                </article>
            );
        };

        const Footer = ({ openCoach, openPartner }) => (
            <footer className="bg-slate-900 text-white py-12 px-4 border-t border-slate-800">
                <div className="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8">
                    <div className="col-span-1 md:col-span-2">
                        <div className="flex items-center gap-2 mb-4">
                            <span className="text-2xl font-black tracking-tight">♟ GrowMyChess</span>
                        </div>
                        <p className="text-gray-400 mb-6 max-w-sm">Making kids smarter, one move at a time. The premium online academy.</p>
                        <p className="text-gray-400 text-sm">© 2026 GrowMyChess. All rights reserved.</p>
                    </div>
                    <div>
                        <h4 className="font-bold mb-4 text-orange-500 uppercase tracking-widest text-sm">Quick Links</h4>
                        <ul className="space-y-2 text-gray-300">
                            <li><a href="#home" className="hover:text-white transition">Home</a></li>
                            <li><a href="#blogs" className="hover:text-white transition">Our Blog</a></li>
                            <li><a href="mailto:hello@growmychess.com" className="hover:text-white transition">hello@growmychess.com</a></li>
                        </ul>
                    </div>
                    <div>
                        <h4 className="font-bold mb-4 text-orange-500 uppercase tracking-widest text-sm">Work With Us</h4>
                        <ul className="space-y-2 text-gray-300">
                            <li><button onClick={openCoach} className="hover:text-white text-left transition">Apply as Coach</button></li>
                            <li><button onClick={openPartner} className="hover:text-white text-left transition">Partner Program</button></li>
                        </ul>
                    </div>
                </div>
            </footer>
        );

        const App = () => {
            // Modal State
            const [modalState, setModalState] = useState({ type: null }); 
            const close = () => setModalState({ type: null });

            // Router State
            const [currentPath, setCurrentPath] = useState(window.location.hash || '#home');

            useEffect(() => {
                const handleHashChange = () => {
                    setCurrentPath(window.location.hash || '#home');
                    window.scrollTo(0, 0); // Scroll to top when changing pages
                };
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            useEffect(() => {
                document.body.style.overflow = modalState.type ? 'hidden' : 'unset';
            }, [modalState.type]);

            // Router Logic
            const renderPageContent = () => {
                if (currentPath === '#blogs') {
                    return <BlogIndexPage />;
                }
                
                if (currentPath.startsWith('#post/')) {
                    const postId = currentPath.split('#post/')[1];
                    return <BlogPostPage id={postId} openDemo={() => setModalState({ type: 'demo' })} />;
                }

                // Default Fallback: Home Page
                return (
                    <>
                        <Hero openDemo={() => setModalState({ type: 'demo' })} />
                        <SocialProof />
                        <Methodology />
                        <Curriculum />
                        <Founder />
                        <Pricing openDemo={() => setModalState({ type: 'demo' })} />
                        <FAQ />
                        <BlogPreview />
                    </>
                );
            };

            return (
                <div className="relative">
                    <Navbar openDemo={() => setModalState({ type: 'demo' })} />
                    
                    {/* Rendered View based on Hash URL */}
                    {renderPageContent()}

                    <Footer openCoach={() => setModalState({ type: 'coach' })} openPartner={() => setModalState({ type: 'partner' })} />
                    
                    {/* Floating WhatsApp */}
                    <a href="https://wa.me/917387494614" target="_blank" rel="noopener noreferrer" className="fixed bottom-6 right-6 bg-[#25D366] p-4 rounded-full shadow-2xl hover:scale-110 transition-transform z-40 flex items-center justify-center">
                        <Icons.WhatsApp />
                    </a>

                    {/* Modals */}
                    <BookDemoForm isOpen={modalState.type === 'demo'} onClose={close} />
                    <HiringForm isOpen={modalState.type === 'coach'} onClose={close} type="coach" />
                    <HiringForm isOpen={modalState.type === 'partner'} onClose={close} type="partner" />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
